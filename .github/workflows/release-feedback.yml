name: Release @kolibri-day/feedback

# Publishes packages/feedback to npm when a tag `feedback-v<version>` is pushed.
#
# Trusted publishing: npm exchanges this workflow's OIDC token for a short-lived
# publish credential, so no npm token is stored in this repository, and every version
# carries a provenance statement naming the commit and the run that built it. The
# package's npm settings must name this repository and this file — see
# packages/feedback/README.md, "Releasing", for the one-time setup.
on:
  push:
    tags: ['feedback-v*']

permissions:
  contents: read

# Two tags pushed in a row must not race each other to the registry.
concurrency:
  group: release-feedback
  cancel-in-progress: false

jobs:
  # Everything that runs dependency code happens here, without the OIDC token.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      # A tag is a promise about what it publishes. Refuse one whose name and the
      # package version disagree, or that points at a commit main never had — a tag on
      # an unreviewed branch would otherwise publish unreviewed code.
      - name: Tag names the package version, on a commit from main
        run: |
          version=$(node -p "require('./packages/feedback/package.json').version")
          if [ "feedback-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match packages/feedback/package.json version $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npx tsc --noEmit -p packages/feedback
      - run: npm run test:feedback
      - run: npm run build -w @kolibri-day/feedback
      - run: npm pack -w @kolibri-day/feedback --ignore-scripts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: feedback-package
          path: kolibri-day-feedback-*.tgz
          if-no-files-found: error
          retention-days: 1

  # Only this job can mint the OIDC token; it installs nothing but a pinned npm.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@11.21.1 --no-audit --no-fund --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: feedback-package
      - run: npm publish "./kolibri-day-feedback-${GITHUB_REF_NAME#feedback-v}.tgz" --access public
