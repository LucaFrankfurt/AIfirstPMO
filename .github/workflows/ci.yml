name: CI

on:
  # Two moments matter, and only two: a change proposed for main, and a change
  # landing on main. A push to a working branch is neither — it is covered when
  # that branch opens a pull request. Running on every branch push also fired
  # both triggers on the same commit, which ran the whole thing twice.
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Successive pushes to the same PR supersede each other; only the newest commit
# is worth a runner.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22.18+ runs the server's TypeScript directly and ships node:sqlite.
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  smoke:
    runs-on: ubuntu-latest
    needs: test
    # Without this a hung step sits on a runner until the six-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      # Playwright is only needed here, so it stays out of the manifest.
      - name: A browser to walk with
        # Bounded, because this step is what hung the job for hours.
        timeout-minutes: 10
        run: |
          npm install --no-save playwright
          # Not `--with-deps`: that shells out to apt, and apt on this runner
          # answers `Ign:` for every InRelease on the Azure mirror and retries
          # until something kills it. Nothing here needs a package manager.
          # The image already ships Google Chrome, which is the same engine and
          # brings the shared libraries Playwright's chromium would have wanted,
          # so walk with that and download nothing.
          if [ -x /usr/bin/google-chrome ]; then
            echo "CHROMIUM_PATH=/usr/bin/google-chrome" >> "$GITHUB_ENV"
          else
            # And if a future image drops it, fetch the browser over HTTPS from
            # Playwright's CDN — still no apt.
            npx playwright install chromium
          fi
      - name: Seed and start the server
        run: |
          npm run seed
          # The log goes to a file, and that is not tidiness. A background
          # process started here inherits this step's stdout, the runner reads
          # that pipe until it closes, and the pipe cannot close while the
          # server holds it — so the step hangs until the job times out, having
          # already printed everything it meant to.
          PORT=4400 npm start > /tmp/kolibri-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:4400/api/health && break; sleep 2; done
          # And say so here rather than in a walkthrough that cannot reach it.
          curl -fs http://127.0.0.1:4400/api/health > /dev/null || {
            echo "the server never became healthy"; cat /tmp/kolibri-server.log; exit 1
          }
      - name: Browser walkthrough
        run: node scripts/smoke.mjs
        env:
          KOLIBRI_URL: http://127.0.0.1:4400
      # The same walk in the other languages: a missing translation shows up as
      # a selector that no longer matches, which is exactly what should fail the
      # build.
      - name: Browser walkthrough (German)
        run: node scripts/smoke.mjs
        env:
          KOLIBRI_URL: http://127.0.0.1:4400
          KOLIBRI_LOCALE: de

      - name: Browser walkthrough (French)
        run: node scripts/smoke.mjs
        env:
          KOLIBRI_URL: http://127.0.0.1:4400
          KOLIBRI_LOCALE: fr

      # Four questions a walkthrough cannot answer, against the instance it
      # just walked: a class the stylesheet never defined, a control a screen
      # reader cannot name, a word under the contrast floor, and a layout that
      # comes apart at a width nobody happened to open. They have existed as
      # `npm run check:*` for a while and only ever run by hand, which is the
      # same as not running — each of them was failing on main by the time
      # they were first pointed at it.
      - name: Stylesheet, names, contrast and widths
        run: |
          npm run check:css
          npm run check:a11y
          npm run check:contrast
          npm run check:responsive
        env:
          KOLIBRI_URL: http://127.0.0.1:4400

      - name: What the server thought, if anything went wrong
        if: failure()
        run: cat /tmp/kolibri-server.log || true

  # The deployment itself is the thing under test here: one command has to
  # produce a working instance with storage and mail already wired up.
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Bring up the whole stack
        run: |
          cat > .env <<'EOF'
          KOLIBRI_ADMIN_EMAIL=owner@example.com
          KOLIBRI_ADMIN_PASSWORD=a good long password
          KOLIBRI_WORKSPACE_NAME=CI
          KOLIBRI_S3_SECRET_KEY=ci-secret-key
          EOF
          docker compose up -d --build --wait --wait-timeout 300

      - name: The instance provisioned itself
        run: |
          health=$(curl -fsS http://127.0.0.1:4000/api/health)
          echo "$health"
          echo "$health" | grep -q '"ready":true'      || { echo "not provisioned"; exit 1; }
          echo "$health" | grep -q '"storage":"s3"'    || { echo "object storage not active"; exit 1; }
          # The default stack deliberately has no relay: mail must report "off",
          # never a capture tool dressed up as working delivery.
          echo "$health" | grep -q '"mail":"off"'      || { echo "mail should be off by default"; exit 1; }

      - name: The owner account exists without anyone clicking anything
        run: |
          curl -fsS -c jar -X POST http://127.0.0.1:4000/api/auth/login \
            -H 'content-type: application/json' \
            -d '{"email":"owner@example.com","password":"a good long password"}' \
            | tee session.json | grep -q '"role":"owner"'
          echo "workspace: $(grep -o '"name":"CI"' session.json)"

      - name: An upload lands in MinIO and comes back
        run: |
          ws=$(python3 -c "import json;print(json.load(open('session.json'))['workspaces'][0]['id'])")
          printf 'hello object storage' > sample.txt
          url=$(curl -fsS -b jar -X POST "http://127.0.0.1:4000/api/workspaces/$ws/files" \
                 -H 'content-type: text/plain' -H 'x-filename: sample.txt' \
                 --data-binary @sample.txt | python3 -c "import json,sys;print(json.load(sys.stdin)['url'])")
          test "$(curl -fsS -b jar "http://127.0.0.1:4000$url")" = "hello object storage"
          # …and the bytes really are in the bucket, not on the app's disk.
          docker compose exec -T minio mc alias set ci http://127.0.0.1:9000 kolibri ci-secret-key >/dev/null
          docker compose exec -T minio mc ls --recursive ci/kolibri | tee objects.txt
          test -s objects.txt

      - name: Without a relay, mail is refused rather than silently dropped
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -b jar -X POST http://127.0.0.1:4000/api/mail/test)
          test "$code" = "400" || { echo "expected 400 without a relay, got $code"; exit 1; }

      - name: Restarting changes nothing
        run: |
          docker compose restart kolibri
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:4000/api/health | grep -q '"ready":true' && break; sleep 2; done
          users=$(docker compose exec -T kolibri node --experimental-sqlite -e \
            "const{DatabaseSync}=require('node:sqlite');console.log(new DatabaseSync('/data/kolibri.sqlite').prepare('select count(*) c from users').get().c)")
          test "$users" -eq 1 || { echo "provisioning was not idempotent: $users users"; exit 1; }

      # A backup nobody has restored is a hope. This takes one inside the
      # container, verifies it, and restores it over the running instance —
      # against the real image, on a real volume, with the real object store.
      - name: A snapshot can be taken, checked and put back
        run: |
          docker compose exec -T kolibri kolibri doctor | tee doctor.txt
          if grep -q '✗' doctor.txt; then echo "the doctor found something broken"; exit 1; fi

          docker compose exec -T kolibri kolibri backup /data/snapshot
          docker compose exec -T kolibri kolibri verify /data/snapshot | grep -q 'readable Kolibri snapshot'

          docker compose stop kolibri
          docker compose run --rm --entrypoint kolibri kolibri restore /data/snapshot --force | grep -q 'Restored'
          docker compose start kolibri
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:4000/api/health | grep -q '"ready":true' && break; sleep 2; done

          # The proof is signing in afterwards: the account survived the round trip.
          curl -fsS -c jar3 -X POST http://127.0.0.1:4000/api/auth/login \
            -H 'content-type: application/json' \
            -d '{"email":"owner@example.com","password":"a good long password"}' | grep -q '"role":"owner"'

      # The dev overlay is what makes email demonstrable: it adds the capture
      # inbox and wires the app to it in one command.
      - name: The dev overlay delivers mail into the capture inbox
        run: |
          dev="docker compose -f docker-compose.yml -f docker-compose.dev.yml"
          $dev up -d --build --wait --wait-timeout 300
          curl -fsS http://127.0.0.1:4000/api/health | grep -q '"mail":"test-inbox"' \
            || { echo "the capture inbox must be labelled as such"; exit 1; }

          curl -fsS -c jar2 -X POST http://127.0.0.1:4000/api/auth/login \
            -H 'content-type: application/json' \
            -d '{"email":"owner@example.com","password":"a good long password"}' >/dev/null
          curl -fsS -b jar2 -X POST http://127.0.0.1:4000/api/mail/test | grep -q '"sent":true'

          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8025/api/v1/messages | grep -q 'Kolibri test email'; then
              echo "delivered to the capture inbox"; exit 0
            fi
            sleep 2
          done
          echo "no message in the inbox"; $dev logs kolibri mailpit; exit 1

      - name: The single-container variant also comes up
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml down -v
          docker compose -f docker-compose.lite.yml up -d --build --wait --wait-timeout 180
          curl -fsS http://127.0.0.1:4000/api/health | grep -q '"storage":"disk"'
          docker compose -f docker-compose.lite.yml down -v

      - name: Diagnostics on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml ps
          docker compose -f docker-compose.yml -f docker-compose.dev.yml logs --tail 200
