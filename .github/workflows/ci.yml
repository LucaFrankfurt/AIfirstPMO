name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22.18+ runs the server's TypeScript directly and ships node:sqlite.
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      # Playwright is only needed here, so it stays out of the manifest.
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Seed and start the server
        run: |
          npm run seed
          PORT=4400 npm start &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:4400/api/health && break; sleep 2; done
      - name: Browser walkthrough
        run: node scripts/smoke.mjs
        env:
          KOLIBRI_URL: http://127.0.0.1:4400

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t kolibri:ci .
      - name: Boot it and check health
        run: |
          docker run -d --name kolibri -p 4000:4000 -v kolibri-ci:/data kolibri:ci
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:4000/api/health; then exit 0; fi
            sleep 2
          done
          docker logs kolibri
          exit 1
