version: 2
updates:
  # The root covers every workspace; sites/* keep their own lockfiles on purpose.
  - package-ecosystem: npm
    directories:
      - "/"
      - "/sites/demo"
      - "/sites/docs"
      - "/sites/video"
    schedule:
      interval: weekly
    groups:
      # The Radix packages share their primitives (the dismissable layer, the
      # focus scope, the portal). Bumped one at a time, each installs a second
      # copy of those beside the first, and two copies of the dismissable layer
      # keep two separate layer stacks — #160 and #164 would have done that.
      radix:
        patterns: ["@radix-ui/*"]
      # The CLI warns as soon as @capacitor/core and a platform differ by a
      # minor version, and the native bridge comes from the platform packages,
      # not from core: #162 moved core alone.
      capacitor:
        patterns: ["@capacitor/*"]
      # @tailwindcss/vite and @tailwindcss/node pin the exact tailwindcss they
      # compile with. #197 moved tailwindcss alone, which installed 4.3.5 beside
      # the 4.3.3 the plugin kept using: the stylesheet imported one version and
      # was compiled by the other, and CI was green on the mix.
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
    ignore:
      # TypeScript 7 has no compiler API, and two things here read one:
      # scripts/openapi.mjs walks the routes with it (#161 failed there), and
      # @astrojs/check in sites/docs and sites/demo accepts ^5 || ^6 only
      # (#165 and #166 failed at `npm ci`). Lift this when both have moved.
      - dependency-name: typescript
        versions: [">=7"]
      # The types describe the Node the server runs on, which is .nvmrc's major,
      # not the newest one: types for Node 26 offer APIs Node 22 does not have,
      # and the typechecker would then pass code that fails at runtime (#198).
      # Moved by hand, together with .nvmrc and the Dockerfiles.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  # Keeps the SHA pins in .github/workflows moving, with their version comments.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # Five open pull requests is Dependabot's default ceiling, and five sat
    # open for weeks while upload-artifact got none — so download-artifact was
    # proposed at v8 against an upload-artifact left at v4.
    open-pull-requests-limit: 10
    groups:
      # One uploads what the other downloads, in the release workflow only,
      # which no pull request runs: they move together or not at all.
      artifacts:
        patterns: ["actions/upload-artifact", "actions/download-artifact"]
