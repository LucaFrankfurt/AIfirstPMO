# The static server both sites are built onto.
#
# One file, shared: docs.kolibri.day and demo.kolibri.day are the same shape of
# thing — a directory of pre-rendered HTML with a hashed asset folder beside it
# — and two copies of this would drift.
#
# It listens on 8080 rather than 80 so the container needs no privileged port
# and can run as a non-root user.

worker_processes  auto;
error_log  /dev/stderr  warn;
pid        /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Everything nginx would otherwise write under /var, moved somewhere a
  # non-root user can write.
  client_body_temp_path /tmp/client_body;
  proxy_temp_path       /tmp/proxy;
  fastcgi_temp_path     /tmp/fastcgi;
  uwsgi_temp_path       /tmp/uwsgi;
  scgi_temp_path        /tmp/scgi;

  # The client address as the proxy in front saw it, so the log says who asked
  # rather than which of Coolify's proxies relayed it.
  log_format  main  '$http_x_forwarded_for - "$request" $status $body_bytes_sent "$http_user_agent"';
  access_log  /dev/stdout  main;

  sendfile        on;
  tcp_nopush      on;
  keepalive_timeout  30;
  server_tokens   off;

  gzip              on;
  gzip_vary         on;
  gzip_min_length   1024;
  gzip_comp_level   6;
  gzip_types        text/plain text/css text/xml application/javascript
                    application/json application/xml image/svg+xml
                    application/manifest+json;

  server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    charset utf-8;
    charset_types text/css application/javascript application/json image/svg+xml;

    # Redirects must be relative, and this is the directive that matters most
    # in this file.
    #
    # Both sites are built with `trailingSlash: 'always'`, so every page is a
    # directory and every link that arrives without the slash gets a 301 from
    # `try_files $uri/` below. nginx builds that `Location` from `$host` and
    # `$server_port`, and its default is to send an absolute URL — so behind a
    # proxy that terminates TLS the browser was told to go to
    # `http://docs.kolibri.day:8080/planning/cycles/`: the container's private
    # port, and `http` for a site that is only served over `https`. Both wrong,
    # and the port is the one people notice, because nothing answers there.
    #
    # Off, the header is `Location: /planning/cycles/` and the browser keeps the
    # scheme, host and port it already had — which is the only party that knows
    # them. It needs nothing from the proxy and no header to be forwarded.
    #
    # `serve` is what the checks in CI run against and it does not redirect at
    # all, so nothing there could have caught this.
    absolute_redirect off;

    # The three headers a `<meta>` policy cannot carry.
    #
    # `frame-ancestors`, `report-uri` and `sandbox` are ignored by
    # specification when a Content-Security-Policy arrives in a meta tag, and
    # the per-page policy Astro writes — which is where the script and style
    # hashes live — is a meta tag. So the framing rule has to be a header, and
    # this is the only place it can be one.
    add_header X-Content-Type-Options    "nosniff"                always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy   "frame-ancestors 'none'" always;

    # Hashed filenames: the content cannot change without the name changing, so
    # a year is safe and a revalidation is waste.
    location /_astro/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header X-Content-Type-Options "nosniff" always;
      try_files $uri =404;
    }

    # The search index is rebuilt on every deploy and its filenames are not
    # hashed, so it must be revalidated or a reader keeps yesterday's results.
    location /pagefind/ {
      add_header Cache-Control "public, max-age=0, must-revalidate" always;
      add_header X-Content-Type-Options "nosniff" always;
      try_files $uri =404;
    }

    # Pages: `trailingSlash: 'always'` and `build.format: 'directory'` means
    # every route is a directory with an index.html in it. `$uri.html` is the
    # fallback for anything written flat (404.html, and any page a future
    # config emits that way).
    location / {
      add_header Cache-Control "public, max-age=0, must-revalidate" always;
      add_header X-Content-Type-Options    "nosniff" always;
      add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy   "frame-ancestors 'none'" always;
      try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # A health endpoint that costs nothing, for the platform's own check.
    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }
  }
}
