# Kolibri on Coolify.
#
# Coolify → Add Resource → Docker Compose → point it at this repository and set
# the compose file to `docker-compose.coolify.yml`. It builds the Dockerfile,
# runs the stack and terminates TLS itself.
#
# This file differs from docker-compose.yml in four ways, all of them because
# Coolify owns the host:
#
#   1. no `container_name` — Coolify suffixes service names with a UUID so two
#      deployments (or a preview environment) cannot collide,
#   2. `expose` instead of `ports` — nothing is published on the host; Coolify's
#      proxy routes to the container port you give a domain to,
#   3. no Caddy — Coolify's proxy already does TLS,
#   4. secrets come from Coolify's environment, not from defaults in the file.
#
# After the first deploy, set in the Coolify UI:
#   * a domain for the `kolibri` service, pointing at port 4000
#   * KOLIBRI_ADMIN_EMAIL / KOLIBRI_ADMIN_PASSWORD so the owner account exists
#   * KOLIBRI_SMTP_URL if you want email (see docs/notifications.md)
# Then check that KOLIBRI_PUBLIC_URL really shows your https URL — links in
# invites and emails are built from it.

services:
  kolibri:
    build: .
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
    expose:
      - "4000"
    environment:
      # Asks Coolify for a domain and points its proxy at port 4000. The name
      # after SERVICE_FQDN_ has to match this service's name, or Coolify makes
      # no domain and no route.
      - SERVICE_FQDN_KOLIBRI_4000
      # Absolute links — invites, email, MCP output — are built from this by
      # string concatenation, so it has to be a whole URL.
      #
      # `SERVICE_URL_` and not `SERVICE_FQDN_`: Coolify fills the FQDN form with
      # a bare host and no scheme, and the port-suffixed spelling puts the port
      # back in, which would make every link read `host:4000/t/abc` instead of
      # `https://host/t/abc`. The URL form is the whole address with the scheme
      # and without the port, which is exactly what belongs here.
      - KOLIBRI_PUBLIC_URL=$SERVICE_URL_KOLIBRI

      # Signs sessions, API tokens and unsubscribe links. Generated into the
      # volume on first start; set it explicitly to keep sessions alive across a
      # volume reset.
      - KOLIBRI_SECRET=${KOLIBRI_SECRET:-}

      # Close the instance once your team has accounts.
      - KOLIBRI_ALLOW_SIGNUP=${KOLIBRI_ALLOW_SIGNUP:-true}
      - KOLIBRI_MAX_UPLOAD_MB=${KOLIBRI_MAX_UPLOAD_MB:-25}
      - KOLIBRI_LOG_LEVEL=${KOLIBRI_LOG_LEVEL:-info}
      - KOLIBRI_DEFAULT_LOCALE=${KOLIBRI_DEFAULT_LOCALE:-en}
      - KOLIBRI_SESSION_DAYS=${KOLIBRI_SESSION_DAYS:-60}
      - KOLIBRI_TRASH_DAYS=${KOLIBRI_TRASH_DAYS:-0}
      - KOLIBRI_ALLOW_PRIVATE_WEBHOOKS=${KOLIBRI_ALLOW_PRIVATE_WEBHOOKS:-}
      # Coolify's proxy terminates TLS and forwards, so the client address has
      # to come from `x-forwarded-for` — nothing else reaches the container.
      - KOLIBRI_TRUST_PROXY=${KOLIBRI_TRUST_PROXY:-true}
      - TZ=${TZ:-UTC}

      # First-run provisioning: set these and the owner account, its workspace
      # and a starter project exist as soon as the deploy is healthy.
      - KOLIBRI_ADMIN_EMAIL=${KOLIBRI_ADMIN_EMAIL:-}
      - KOLIBRI_ADMIN_PASSWORD=${KOLIBRI_ADMIN_PASSWORD:-}
      - KOLIBRI_ADMIN_NAME=${KOLIBRI_ADMIN_NAME:-Owner}
      - KOLIBRI_WORKSPACE_NAME=${KOLIBRI_WORKSPACE_NAME:-Kolibri}
      - KOLIBRI_SEED_DEMO=${KOLIBRI_SEED_DEMO:-false}

      # Uploads go to the MinIO service below, reachable by service name on the
      # shared network. The bucket is created by the app on boot.
      - KOLIBRI_STORAGE=s3
      - KOLIBRI_S3_ENDPOINT=http://minio:9000
      - KOLIBRI_S3_BUCKET=${KOLIBRI_S3_BUCKET:-kolibri}
      - KOLIBRI_S3_REGION=us-east-1
      - KOLIBRI_S3_ACCESS_KEY=${SERVICE_USER_MINIO}
      - KOLIBRI_S3_SECRET_KEY=${SERVICE_PASSWORD_MINIO}
      - KOLIBRI_S3_PATH_STYLE=true
      # MinIO has no public address here, so downloads are proxied by the app.
      - KOLIBRI_S3_PRESIGN=false
      - KOLIBRI_S3_PRESIGN_SECONDS=${KOLIBRI_S3_PRESIGN_SECONDS:-300}
      # Only useful if you also give the MinIO service a domain: pre-signed URLs
      # are signed for the host the browser resolves, not the internal one.
      - KOLIBRI_S3_PUBLIC_ENDPOINT=${KOLIBRI_S3_PUBLIC_ENDPOINT:-}

      # Email is off until this points at a relay you control.
      - KOLIBRI_SMTP_URL=${KOLIBRI_SMTP_URL:-}
      - KOLIBRI_MAIL_FROM=${KOLIBRI_MAIL_FROM:-kolibri@localhost}
      - KOLIBRI_MAIL_FROM_NAME=${KOLIBRI_MAIL_FROM_NAME:-Kolibri}
      - KOLIBRI_MAIL_REPLY_TO=${KOLIBRI_MAIL_REPLY_TO:-}
      - KOLIBRI_SMTP_HOST=${KOLIBRI_SMTP_HOST:-}
      - KOLIBRI_SMTP_PORT=${KOLIBRI_SMTP_PORT:-587}
      - KOLIBRI_SMTP_ENCRYPTION=${KOLIBRI_SMTP_ENCRYPTION:-}
      - KOLIBRI_SMTP_USER=${KOLIBRI_SMTP_USER:-}
      - KOLIBRI_SMTP_PASS=${KOLIBRI_SMTP_PASS:-}
      - KOLIBRI_SMTP_INSECURE=${KOLIBRI_SMTP_INSECURE:-false}
      - KOLIBRI_MAIL_BATCH_SECONDS=${KOLIBRI_MAIL_BATCH_SECONDS:-120}
      - KOLIBRI_MAIL_POLL_SECONDS=${KOLIBRI_MAIL_POLL_SECONDS:-20}
      - KOLIBRI_MAIL_MAX_ATTEMPTS=${KOLIBRI_MAIL_MAX_ATTEMPTS:-6}
      - KOLIBRI_BOUNCE_TOKEN=${KOLIBRI_BOUNCE_TOKEN:-}
      # Scaleway Transactional Email over HTTP, for hosts that block SMTP ports.
      - KOLIBRI_MAIL_TRANSPORT=${KOLIBRI_MAIL_TRANSPORT:-}
      - KOLIBRI_SCALEWAY_SECRET_KEY=${KOLIBRI_SCALEWAY_SECRET_KEY:-}
      - KOLIBRI_SCALEWAY_PROJECT_ID=${KOLIBRI_SCALEWAY_PROJECT_ID:-}
      - KOLIBRI_SCALEWAY_EMAIL_URL=${KOLIBRI_SCALEWAY_EMAIL_URL:-}

      # Single sign-on. Empty issuer keeps the sign-in screen a password form.
      # Register the redirect URI https://<your-domain>/api/auth/oidc/callback at
      # the provider — it is built from KOLIBRI_PUBLIC_URL above.
      - KOLIBRI_OIDC_ISSUER=${KOLIBRI_OIDC_ISSUER:-}
      - KOLIBRI_OIDC_CLIENT_ID=${KOLIBRI_OIDC_CLIENT_ID:-}
      - KOLIBRI_OIDC_CLIENT_SECRET=${KOLIBRI_OIDC_CLIENT_SECRET:-}
      - KOLIBRI_OIDC_SCOPE=${KOLIBRI_OIDC_SCOPE:-openid email profile}
      - KOLIBRI_OIDC_LABEL=${KOLIBRI_OIDC_LABEL:-Single sign-on}
      - KOLIBRI_OIDC_AUTO_CREATE=${KOLIBRI_OIDC_AUTO_CREATE:-true}
      - KOLIBRI_OIDC_ONLY=${KOLIBRI_OIDC_ONLY:-false}
      - KOLIBRI_OIDC_WORKSPACE=${KOLIBRI_OIDC_WORKSPACE:-}
      - KOLIBRI_OIDC_GROUPS_CLAIM=${KOLIBRI_OIDC_GROUPS_CLAIM:-groups}
      - KOLIBRI_OIDC_ROLE_MAP=${KOLIBRI_OIDC_ROLE_MAP:-}
      - KOLIBRI_OIDC_DEFAULT_ROLE=${KOLIBRI_OIDC_DEFAULT_ROLE:-member}

      # Task reviews. Off until both a key here and "Task reviews" in
      # Settings -> Workspace. The vendor names are passed under their own names
      # because an unlabelled key says nothing about whose it is. See docs/ai.md.
      - KOLIBRI_AI_PROVIDER=${KOLIBRI_AI_PROVIDER:-}
      - KOLIBRI_AI_API_KEY=${KOLIBRI_AI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - KOLIBRI_AI_MODEL=${KOLIBRI_AI_MODEL:-}
      - KOLIBRI_AI_BASE_URL=${KOLIBRI_AI_BASE_URL:-}
      - KOLIBRI_AI_TIMEOUT_MS=${KOLIBRI_AI_TIMEOUT_MS:-20000}
      - KOLIBRI_AI_BURST=${KOLIBRI_AI_BURST:-10}
      - KOLIBRI_AI_EVERY_SECONDS=${KOLIBRI_AI_EVERY_SECONDS:-20}

      # Native notifications. The VAPID pair is generated into the volume on
      # first use; set it to keep subscriptions across a restore.
      - KOLIBRI_PUSH=${KOLIBRI_PUSH:-true}
      - KOLIBRI_VAPID_PUBLIC=${KOLIBRI_VAPID_PUBLIC:-}
      - KOLIBRI_VAPID_PRIVATE=${KOLIBRI_VAPID_PRIVATE:-}
      - KOLIBRI_VAPID_SUBJECT=${KOLIBRI_VAPID_SUBJECT:-}

      # Telegram. Long-polled, so it needs no public URL of its own.
      - KOLIBRI_TELEGRAM_BOT_TOKEN=${KOLIBRI_TELEGRAM_BOT_TOKEN:-}
      - KOLIBRI_TELEGRAM_POLL_SECONDS=${KOLIBRI_TELEGRAM_POLL_SECONDS:-25}
      - KOLIBRI_TELEGRAM_MAX_ATTEMPTS=${KOLIBRI_TELEGRAM_MAX_ATTEMPTS:-5}
    volumes:
      - kolibri-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      # Coolify generates and stores these on the first deploy, so no object
      # storage credentials live in the repository.
      - MINIO_ROOT_USER=${SERVICE_USER_MINIO}
      - MINIO_ROOT_PASSWORD=${SERVICE_PASSWORD_MINIO}
    expose:
      - "9000"
      # Give this port a domain in Coolify only if you want the admin console
      # reachable; the app itself does not need it.
      - "9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  kolibri-data:
  minio-data:
