# Kolibri — the whole stack, wired and configured.
#
#   docker compose up -d --build
#
# That is the entire installation. It brings up the app and an S3-compatible
# object store for uploads, already pointed at each other: the bucket is
# created on first boot, the owner account comes from the environment, and
# nothing needs to be clicked to finish setup.
#
#   App        http://localhost:4000
#   S3 console http://localhost:9001   (login: the S3 keys below)
#
# Email is *off* until you point KOLIBRI_SMTP_URL at a relay you control.
# Notifications still work — they live in the in-app inbox. A default that
# quietly swallowed every message would look identical to one that delivers.
#
# To try email locally, add the dev overlay — it runs a capture inbox and
# wires the app to it:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# Single container, uploads on the volume, no object store:
#
#   docker compose -f docker-compose.lite.yml up -d --build

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # The Dockerfile in this directory is the build; compose only names the
  # result and wires it up. Nothing is published to a registry yet, so this
  # tag is local.
  kolibri:
    build: .
    image: kolibri:local
    container_name: kolibri
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "${KOLIBRI_PORT:-4000}:4000"
    environment:
      # Signs sessions, API tokens and unsubscribe links. Generated into the
      # volume on first start if you leave it empty.
      KOLIBRI_SECRET: "${KOLIBRI_SECRET:-}"
      KOLIBRI_PUBLIC_URL: "${KOLIBRI_PUBLIC_URL:-http://localhost:4000}"
      KOLIBRI_ALLOW_SIGNUP: "${KOLIBRI_ALLOW_SIGNUP:-true}"
      KOLIBRI_MAX_UPLOAD_MB: "${KOLIBRI_MAX_UPLOAD_MB:-25}"
      KOLIBRI_SESSION_DAYS: "${KOLIBRI_SESSION_DAYS:-60}"
      KOLIBRI_LOG_LEVEL: "${KOLIBRI_LOG_LEVEL:-info}"
      KOLIBRI_DEFAULT_LOCALE: "${KOLIBRI_DEFAULT_LOCALE:-en}"
      # Read the client address from `x-forwarded-for`. Right behind the
      # bundled Caddy — set it to false if you publish port 4000 directly, or a
      # client can invent its own address and with it its own rate limit.
      KOLIBRI_TRUST_PROXY: "${KOLIBRI_TRUST_PROXY:-true}"
      # Days a deleted thing stays recoverable. `0` keeps it until an admin
      # empties the trash themselves.
      KOLIBRI_TRASH_DAYS: "${KOLIBRI_TRASH_DAYS:-0}"
      # Let outgoing webhooks reach private addresses (`http://n8n:5678` on this
      # network). Off by default; see docs/deployment.md.
      KOLIBRI_ALLOW_PRIVATE_WEBHOOKS: "${KOLIBRI_ALLOW_PRIVATE_WEBHOOKS:-}"

      # --- first-run provisioning -----------------------------------------
      # Set these and the owner account exists the moment the stack is up.
      # Leave them empty to claim the instance yourself in the browser.
      KOLIBRI_ADMIN_EMAIL: "${KOLIBRI_ADMIN_EMAIL:-}"
      KOLIBRI_ADMIN_PASSWORD: "${KOLIBRI_ADMIN_PASSWORD:-}"
      KOLIBRI_ADMIN_NAME: "${KOLIBRI_ADMIN_NAME:-Owner}"
      KOLIBRI_WORKSPACE_NAME: "${KOLIBRI_WORKSPACE_NAME:-Kolibri}"
      # Fill an empty database with a demo workspace to look around in.
      KOLIBRI_SEED_DEMO: "${KOLIBRI_SEED_DEMO:-false}"

      # --- object storage --------------------------------------------------
      # The bucket is created by the app on boot; there is nothing to set up
      # in MinIO by hand.
      KOLIBRI_STORAGE: "${KOLIBRI_STORAGE:-s3}"
      KOLIBRI_S3_ENDPOINT: "${KOLIBRI_S3_ENDPOINT:-http://minio:9000}"
      KOLIBRI_S3_BUCKET: "${KOLIBRI_S3_BUCKET:-kolibri}"
      KOLIBRI_S3_REGION: "${KOLIBRI_S3_REGION:-us-east-1}"
      KOLIBRI_S3_ACCESS_KEY: "${KOLIBRI_S3_ACCESS_KEY:-kolibri}"
      KOLIBRI_S3_SECRET_KEY: "${KOLIBRI_S3_SECRET_KEY:-kolibri-secret-change-me}"
      KOLIBRI_S3_PATH_STYLE: "true"
      # Pre-signed URLs are signed for the host the *browser* resolves, which
      # is not the internal one. Off by default, so downloads are proxied by
      # the app and work from anywhere; turn it on together with a public
      # endpoint to hand the bandwidth to MinIO.
      KOLIBRI_S3_PRESIGN: "${KOLIBRI_S3_PRESIGN:-false}"
      KOLIBRI_S3_PUBLIC_ENDPOINT: "${KOLIBRI_S3_PUBLIC_ENDPOINT:-}"
      KOLIBRI_S3_PRESIGN_SECONDS: "${KOLIBRI_S3_PRESIGN_SECONDS:-300}"

      # --- email -----------------------------------------------------------
      # Empty means no email at all: notifications stay in the in-app inbox,
      # which is the source of truth anyway. Set a relay to turn it on:
      #   smtp://user:pass@smtp.example.com:587
      KOLIBRI_SMTP_URL: "${KOLIBRI_SMTP_URL:-}"
      # Or piece by piece, which is the shape most providers hand you. The
      # encryption follows the port unless it is set: 465 is TLS, anything else
      # is STARTTLS — and STARTTLS is required rather than attempted.
      KOLIBRI_SMTP_HOST: "${KOLIBRI_SMTP_HOST:-}"
      KOLIBRI_SMTP_PORT: "${KOLIBRI_SMTP_PORT:-587}"
      KOLIBRI_SMTP_ENCRYPTION: "${KOLIBRI_SMTP_ENCRYPTION:-}"
      KOLIBRI_SMTP_USER: "${KOLIBRI_SMTP_USER:-}"
      KOLIBRI_SMTP_PASS: "${KOLIBRI_SMTP_PASS:-}"
      # Scaleway Transactional Email instead of a relay, for hosts that block
      # outbound SMTP ports. See docs/notifications.md.
      KOLIBRI_MAIL_TRANSPORT: "${KOLIBRI_MAIL_TRANSPORT:-}"
      KOLIBRI_SCALEWAY_SECRET_KEY: "${KOLIBRI_SCALEWAY_SECRET_KEY:-${SCW_SECRET_KEY_EMAIL:-}}"
      KOLIBRI_SCALEWAY_PROJECT_ID: "${KOLIBRI_SCALEWAY_PROJECT_ID:-${SCW_PROJECT_ID:-}}"
      KOLIBRI_SCALEWAY_EMAIL_URL: "${KOLIBRI_SCALEWAY_EMAIL_URL:-${SCW_EMAIL_API_URL:-}}"
      KOLIBRI_MAIL_FROM: "${KOLIBRI_MAIL_FROM:-${EMAIL_FROM_INFO:-kolibri@localhost}}"
      KOLIBRI_MAIL_FROM_NAME: "${KOLIBRI_MAIL_FROM_NAME:-${EMAIL_FROM_NAME:-Kolibri}}"
      KOLIBRI_MAIL_BATCH_SECONDS: "${KOLIBRI_MAIL_BATCH_SECONDS:-120}"
      KOLIBRI_MAIL_REPLY_TO: "${KOLIBRI_MAIL_REPLY_TO:-}"
      KOLIBRI_MAIL_POLL_SECONDS: "${KOLIBRI_MAIL_POLL_SECONDS:-20}"
      # Give up on a message after this many tries (1, 2, 4 ... minutes apart).
      KOLIBRI_MAIL_MAX_ATTEMPTS: "${KOLIBRI_MAIL_MAX_ATTEMPTS:-6}"
      # Accept a self-signed certificate on an internal relay.
      KOLIBRI_SMTP_INSECURE: "${KOLIBRI_SMTP_INSECURE:-false}"
      # A shared secret your provider posts bounce reports with, at
      # POST /api/mail/bounces. Empty disables that endpoint.
      KOLIBRI_BOUNCE_TOKEN: "${KOLIBRI_BOUNCE_TOKEN:-}"

      # --- single sign-on ---------------------------------------------------
      # Empty issuer means the sign-in screen stays a password form. See
      # docs/deployment.md for what to register at the provider.
      KOLIBRI_OIDC_ISSUER: "${KOLIBRI_OIDC_ISSUER:-}"
      KOLIBRI_OIDC_CLIENT_ID: "${KOLIBRI_OIDC_CLIENT_ID:-}"
      KOLIBRI_OIDC_CLIENT_SECRET: "${KOLIBRI_OIDC_CLIENT_SECRET:-}"
      KOLIBRI_OIDC_SCOPE: "${KOLIBRI_OIDC_SCOPE:-openid email profile}"
      KOLIBRI_OIDC_LABEL: "${KOLIBRI_OIDC_LABEL:-Single sign-on}"
      KOLIBRI_OIDC_AUTO_CREATE: "${KOLIBRI_OIDC_AUTO_CREATE:-true}"
      KOLIBRI_OIDC_ONLY: "${KOLIBRI_OIDC_ONLY:-false}"
      # Which workspace accounts made through the provider join (slug or id).
      KOLIBRI_OIDC_WORKSPACE: "${KOLIBRI_OIDC_WORKSPACE:-}"
      # With a role map set the directory is the authority — a role changed
      # inside Kolibri is overwritten on the next sign-in. See docs/deployment.md.
      KOLIBRI_OIDC_GROUPS_CLAIM: "${KOLIBRI_OIDC_GROUPS_CLAIM:-groups}"
      KOLIBRI_OIDC_ROLE_MAP: "${KOLIBRI_OIDC_ROLE_MAP:-}"
      KOLIBRI_OIDC_DEFAULT_ROLE: "${KOLIBRI_OIDC_DEFAULT_ROLE:-member}"


      # --- task reviews ------------------------------------------------------
      # A model reads a task back and suggests clearer wording. Off until both a
      # key here and "Task reviews" in Settings -> Workspace. See docs/ai.md.
      #
      # The three vendor names are passed under their own names on purpose: an
      # unlabelled key says nothing about whose it is, so it is the vendor
      # variable that tells the server which provider to talk to.
      KOLIBRI_AI_PROVIDER: "${KOLIBRI_AI_PROVIDER:-}"
      KOLIBRI_AI_API_KEY: "${KOLIBRI_AI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      # Each provider has a default; this is the cost lever.
      KOLIBRI_AI_MODEL: "${KOLIBRI_AI_MODEL:-}"
      # For a gateway, a proxy, or a model on this docker network.
      KOLIBRI_AI_BASE_URL: "${KOLIBRI_AI_BASE_URL:-}"
      KOLIBRI_AI_TIMEOUT_MS: "${KOLIBRI_AI_TIMEOUT_MS:-20000}"
      # Reviews one person may ask for: a burst, then one back every N seconds.
      KOLIBRI_AI_BURST: "${KOLIBRI_AI_BURST:-10}"
      KOLIBRI_AI_EVERY_SECONDS: "${KOLIBRI_AI_EVERY_SECONDS:-20}"

      # --- native notifications ----------------------------------------------
      # The VAPID pair is generated into the volume on first use; set it to keep
      # subscriptions across a restore into a fresh volume.
      KOLIBRI_PUSH: "${KOLIBRI_PUSH:-true}"
      KOLIBRI_VAPID_PUBLIC: "${KOLIBRI_VAPID_PUBLIC:-}"
      KOLIBRI_VAPID_PRIVATE: "${KOLIBRI_VAPID_PRIVATE:-}"
      KOLIBRI_VAPID_SUBJECT: "${KOLIBRI_VAPID_SUBJECT:-}"

      # --- telegram ----------------------------------------------------------
      # Off without a bot token, and the token is the whole configuration: each
      # person links their own chat from inside the app. Long-polled, so this
      # needs no public URL. See docs/notifications.md.
      KOLIBRI_TELEGRAM_BOT_TOKEN: "${KOLIBRI_TELEGRAM_BOT_TOKEN:-}"
      KOLIBRI_TELEGRAM_POLL_SECONDS: "${KOLIBRI_TELEGRAM_POLL_SECONDS:-25}"
      KOLIBRI_TELEGRAM_MAX_ATTEMPTS: "${KOLIBRI_TELEGRAM_MAX_ATTEMPTS:-5}"

      TZ: "${TZ:-UTC}"
    volumes:
      - kolibri-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging

  # Object storage for uploads. Only the console is published; the API is
  # reachable inside the compose network, which is all the app needs.
  minio:
    image: quay.io/minio/minio:latest   # pin to a RELEASE.* tag for reproducible deploys
    container_name: kolibri-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${KOLIBRI_S3_ACCESS_KEY:-kolibri}"
      MINIO_ROOT_PASSWORD: "${KOLIBRI_S3_SECRET_KEY:-kolibri-secret-change-me}"
      MINIO_BROWSER_REDIRECT_URL: "${MINIO_CONSOLE_URL:-http://localhost:9001}"
    ports:
      # Bound to localhost: the console is an admin tool, not a public service.
      - "${MINIO_CONSOLE_BIND:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
      - "${MINIO_API_BIND:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *logging

  # --- optional: automatic HTTPS ------------------------------------------
  # docker compose --profile tls up -d
  # Set KOLIBRI_DOMAIN to a name that points at this host; Caddy obtains and
  # renews the certificate on its own. Remember to set
  # KOLIBRI_PUBLIC_URL=https://$KOLIBRI_DOMAIN as well.
  caddy:
    image: caddy:2-alpine
    container_name: kolibri-caddy
    profiles: ["tls"]
    restart: unless-stopped
    depends_on: [kolibri]
    command: caddy reverse-proxy --from "${KOLIBRI_DOMAIN:-localhost}" --to kolibri:4000
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

volumes:
  kolibri-data:
  minio-data:
  caddy-data:
  caddy-config:
